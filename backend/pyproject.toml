[project]
name = "kitobxon-hub-backend"
version = "0.1.0"
description = "Kitobxon Hub backend: REST API, Telegram bot and background worker"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI uses function calls in defaults (Depends)
    "RUF001", # Uzbek texts legitimately contain ambiguous-looking characters (ʻ, ’)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
markers = ["subscription: keep the required channel subscription check on (it is off in other tests)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async mode runs on greenlets; without this, lines after a database call are missed.
concurrency = ["greenlet", "thread"]
omit = ["app/cli.py", "app/workers/__main__.py", "app/bot/polling.py", "app/load_test.py"]

[tool.coverage.report]
skip_covered = true
show_missing = false
