# Render Blueprint: one free web service running the whole Kitobxon Hub.
# The database is NOT created here on purpose: Render's free PostgreSQL is deleted after
# 30 days, so a permanent free database from Neon (https://neon.tech) is used instead.
# See docs/TEST_HOSTING.md for the step-by-step guide.
services:
  - type: web
    name: kitobxon-hub
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_TELEGRAM_IDS
        sync: false
      # Reminders are checked every 30 minutes so the free Neon database can sleep in between
      # (Neon's free plan has a monthly compute limit). Use 60 on a paid/always-on database.
      - key: WORKER_INTERVAL_SECONDS
        value: "1800"
