# Runs automatically on every push and pull request.
# A green check mark on GitHub means: code style is correct, all automated tests pass (with at
# least 90% of the backend code exercised), database migrations apply cleanly, both web apps
# build, and a real browser can go through the main member and admin journeys.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitobxon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitobxon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install system libraries for PDF reports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation2 fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (with coverage; fails below 90%)
        run: pytest -q --cov --cov-report=term --cov-fail-under=90

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [miniapp, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Browser journeys (Mini App + Admin Panel)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitobxon_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throw-away values for this test run only (no real bot, no real secrets).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitobxon_e2e
      ENVIRONMENT: development
      SECRET_KEY: e2e-only-secret-key-that-is-long-enough-0123456789
      BOT_TOKEN: "123456789:E2E-fake-bot-token-AAAAAAAAAAAAAAAAAAAAAAAAAA"
      BOT_USERNAME: kitobxon_e2e_bot
      BOT_MODE: disabled
      WORKER_ENABLED: "false"
      LOG_JSON: "false"
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            miniapp/package-lock.json
            admin/package-lock.json
            e2e/package-lock.json
      - name: Install system libraries for PDF reports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation2 fonts-dejavu-core
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Build the Mini App and the Admin Panel
        run: |
          for app in miniapp admin; do
            (cd "$app" && npm ci && npm run build)
            mkdir -p "backend/static/$app" && cp -r "$app/dist/." "backend/static/$app/"
          done
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
      # Seeded right before the run: the one-time admin links expire after 5 minutes, and
      # installing the browser can take that long on a slow package mirror.
      - name: Prepare the database
        working-directory: backend
        run: |
          alembic upgrade head
          PYTHONPATH=. python ../e2e/seed.py
      - name: Run browser journeys
        working-directory: e2e
        run: npx playwright test
      - name: Backup round trip (dump, encrypt, verify, restore, compare)
        env:
          PASSPHRASE: ci-only-backup-passphrase
          TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitobxon_restore
          CONFIRM: "yes"
        run: |
          OUT_DIR=/tmp/backups scripts/backup.sh backup
          docker run --rm --network host postgres:18 psql "$DATABASE_URL" -c "CREATE DATABASE kitobxon_restore"
          scripts/backup.sh restore /tmp/backups/*.dump.gpg
          count='select (select count(*) from users), (select count(*) from score_transactions), (select count(*) from test_attempts)'
          before=$(docker run --rm --network host -e Q="$count" postgres:18 sh -c 'psql -tA "$0" -c "$Q"' "$DATABASE_URL")
          after=$(docker run --rm --network host -e Q="$count" postgres:18 sh -c 'psql -tA "$0" -c "$Q"' "$TARGET_DATABASE_URL")
          echo "original: $before | restored: $after"
          [ "$before" = "$after" ]
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kitobxon-hub:ci .
