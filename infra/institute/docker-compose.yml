# Kitobxon Hub on the institute's own server: database, the app (web, bot and background worker in
# one service, as on Render) and HTTPS.
# Step-by-step guide (Uzbek): docs/INSTITUT_SERVERI.md
#
#   cd infra/institute && cp env.example .env && nano .env
#   docker compose up -d --build
#
name: kitobxon

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitobxon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: kitobxon
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitobxon -d kitobxon"]
      interval: 10s
      retries: 10
    shm_size: 256mb

  app:
    build:
      context: ../..
    image: kitobxon-hub:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kitobxon:${POSTGRES_PASSWORD}@db:5432/kitobxon
      ENVIRONMENT: production
      WORKER_ENABLED: "true" # messages go out at once; scheduled checks every minute
      WORKER_INTERVAL_SECONDS: "60"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FORWARDED_ALLOW_IPS: "*" # only Caddy can reach this container
    volumes:
      - ./data/storage:/srv/backend/storage
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - app
