# nginx reverse proxy for a VPS deployment (TLS via certbot / Let's Encrypt).
# The application container listens on 127.0.0.1:8000 and serves the API, the Telegram
# webhook, the Mini App (/app/) and the Admin Panel (/admin/).

server {
    listen 80;
    server_name kitobxon.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kitobxon.example.uz;

    ssl_certificate     /etc/letsencrypt/live/kitobxon.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitobxon.example.uz/privkey.pem;

    client_max_body_size 12m;           # photo uploads for reports
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Long-lived caching for hashed frontend assets.
    location ~ ^/(app|admin)/assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 75s;
    }
}
